name: Add view tracker to new video and document pages

on:
  push:
    branches: [main]
    paths: ["v/**", "d/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject tracker into video pages
        run: python3 tools/inject_tracker.py
      - name: Build tracked pages for PDFs dropped into d/
        run: |
          if ls d/*/*.pdf >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
            python3 tools/doc_page.py --auto
          fi
      - name: Commit if pages changed
        run: |
          if [ -n "$(git status --porcelain v d)" ]; then
            git config user.name "Animohub Bot"
            git config user.email "bot@animohub.studio"
            git add v d
            git commit -m "Add view tracker to new pages"
            git push
          fi
